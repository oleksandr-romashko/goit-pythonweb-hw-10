services:
  api:
    environment:
      LOG_LEVEL: debug
    volumes:
      - .:/app
    command: >
      poetry run uvicorn src.main:app
      --reload
      --host 0.0.0.0
      --port 8000
      --log-level debug

  api-cache:
      ports:
      - "${CACHE_PORT:-6379}:6379"  # For accessing cache directly using own Redis client

  db:
    ports:
      - "${DB_PORT:-5432}:5432"  # For accessing db directly using own DB client